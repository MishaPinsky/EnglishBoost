const w=vocabList[vocabIndex];main(`${pageHead("Словарь","Карточки, новые слова и умное повторение",`<span class="badge">${vocabIndex+1} / ${vocabList.length}</span>`)}${tabs}<div class="card wordcard"><div class="progressbar"><i style="width:${(vocabIndex+1)/vocabList.length*100}%"></i></div><div style="margin-top:22px"><span class="word-level">${Object.keys(words).find(l=>words[l].some(x=>x[0]===w[0]))} · ${vocabMode==='due'?'ПОВТОРЕНИЕ':'СЛОВО'}</span><div class="word-big">${esc(w[0])}</div>${vocabReveal?`<div class="translation">${esc(w[1])}</div><div class="example">${esc(w[2])}<em>${esc(w[3])}</em></div>`:`<p class="muted">Вспомни перевод, затем открой карточку.</p><button class="primary" onclick="vocabReveal=true;render()">Показать перевод</button>`}</div>${vocabReveal?`<div class="word-actions"><button class="soft" onclick="wordAnswer(false)">😅 Забыл(а)</button><button class="primary" onclick="wordAnswer(true)">✓ Знаю слово</button><button class="plain" onclick="nextWord()">Дальше →</button></div>`:""}<p class="muted" style="font-size:12px;margin-top:20px">Слова с ошибками чаще возвращаются в повторение.</p></div>`)}
function nextWord(){vocabIndex++;vocabReveal=false;if(vocabIndex>=vocabList.length){p().lessons.push({id:"vocab-session-"+today()+"-"+p().lessons.length,date:today()});markStudy();addAchievement("first");save();toast("Карточки просмотрены!");vocabIndex=0;if(vocabMode==="new")startVocab("due");else render();return}render()}
function wordAnswer(ok){const w=vocabList[vocabIndex];noteAnswer(w,ok);if(ok&&!p().learned.includes(w[0]))p().learned.push(w[0]);if(p().learned.length>=10)addAchievement("words10");vocabIndex++;vocabReveal=false;if(vocabIndex>=vocabList.length){addAchievement("first");if(dayStreak()>=3)addAchievement("streak3");if(dayStreak()>=7)addAchievement("streak7");save();main(`${pageHead("Отличная работа!","Сессия повторения завершена")}<div class="card empty"><strong>Ты завершил(а) ${vocabList.length} карточек.</strong>Ответы сохранены, а сложные слова появятся в повторении раньше.<p><button class="primary" onclick="go('home')">На главную</button> <button class="soft" onclick="startVocab('due')">Повторить ещё</button></p></div>`);return}render()}
function startWordQuiz(){const list=weightedWords(currentWords()).slice(0,Math.min(10,currentWords().length));session={kind:"word",items:list.map(w=>({type:"word",w})),index:0,correct:0,answers:[],answered:false};vocabMode="quiz";page="vocab";render()}
function grammarPage(){if(session&&session.kind==="grammar"){renderQuestionSession("grammar");return}const qs=grammar[p().level];main(`${pageHead("Грамматика",`Практикуй правила уровня ${p().level} — ${LEVELS[p().level]}`,`<span class="badge">${qs.length} заданий</span>`)}<div class="card"><div class="eyebrow" style="color:#69718b">УРОВЕНЬ ${p().level}</div><h2 style="margin:8px 0">Закрепляй правило на практике</h2><p class="muted">Выбирай ответ, а EnglishBoost объяснит правило по-русски. Прогресс сохраняется в твоём профиле.</p><div class="grid two"><div class="card" style="box-shadow:none;background:#f8f9ff"><div class="ico">✍️</div><b>${qs.length} грамматических вопросов</b><p class="muted" style="font-size:13px">От базовых конструкций до продвинутых нюансов.</p></div><div class="card" style="box-shadow:none;background:#f8f9ff"><div class="ico">💡</div><b>Объяснение каждого ответа</b><p class="muted" style="font-size:13px">Разбирайся в правиле, а не просто угадывай.</p></div></div><p><button class="primary" onclick="startGrammar()">Начать упражнения →</button></p></div>`)}
function startGrammar(){session={kind:"grammar",items:shuffle(grammar[p().level].map((q,i)=>({type:"grammar",q,id:p().level+"-g"+i}))),index:0,correct:0,answers:[],answered:false};render()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startTest(){let pool=[];currentWords().forEach(w=>pool.push({type:"word",w}));grammar[p().level].forEach((q,i)=>pool.push({type:"grammar",q,id:p().level+"-g"+i}));session={kind:"test",items:shuffle(pool).slice(0,10),index:0,correct:0,answers:[],answered:false};page="tests";render()}
function testsPage(){if(session&&session.kind==="test"){renderQuestionSession("tests");return}let recent=p().tests.slice(-5).reverse();main(`${pageHead("Быстрые тесты","Смешанные задания по словарю и грамматике",`<span class="badge">${p().level}</span>`)}<div class="card"><div class="path-ico">⚡</div><h2>Проверь знания за несколько минут</h2><p class="muted">10 уникальных вопросов из словаря и грамматики твоего уровня. В одном тесте вопрос не повторяется.</p><button class="primary" onclick="startTest()">Начать тест · 10 вопросов</button></div><div class="section-title"><div><h2>История тестов</h2><p>Результаты этого профиля</p></div></div><div class="card">${recent.length?recent.map(t=>`<div class="listrow"><div><b>${esc(t.label)}</b><div class="muted" style="font-size:12px">${esc(t.date)} · ${t.correct} из ${t.total} правильных</div></div><span class="badge">${Math.round(t.correct/t.total*100)}%</span></div>`).join(""):`<div class="empty"><strong>Тестов пока нет</strong>Заверши первый тест, и результат появится здесь.</div>`}</div>`)}
function renderQuestionSession(which){if(!session)return;const s=session;if(s.index>=s.items.length){finishSession();return}const item=s.items[s.index],isWord=item.type==="word";let question,correct,options,explanation,word;if(isWord){word=item.w;question=`Как переводится “${word[0]}”?`;correct=word[1];options=shuffle([correct,...shuffle(currentWords().filter(w=>w[0]!==word[0]).map(w=>w[1])).slice(0,3)]);explanation=`${word[0]} — ${word[1]}. Пример: ${word[2]} — ${word[3]}.`}else{const q=item.q;question=q[0];correct=q[1];options=shuffle([q[1],q[2],q[3]]);explanation=q[5]}
s.current={item,question,correct,options,explanation,word};
const title=s.kind==="grammar"?"Грамматическая практика":s.kind==="word"?"Тест слов":"Быстрый тест";
main(`${pageHead(title,`Вопрос ${s.index+1} из ${s.items.length}`,`<button class="plain small" onclick="quitSession()">Выйти</button>`)}<div class="card" style="max-width:760px;margin:auto"><div class="progressbar"><i style="width:${s.index/s.items.length*100}%"></i></div><div class="eyebrow" style="color:#7b84a0;margin-top:20px">${isWord?"СЛОВАРЬ":"ГРАММАТИКА"} · ${p().level}</div><div class="question">${esc(question)}</div><div class="options">${options.map((o,i)=>`<button class="option ${s.answered?(o===correct?'correct':o===s.chosen?'wrong':''):''}" ${s.answered?'disabled':''} onclick="answerSession(${JSON.stringify(o).replace(/"/g,'&quot;')})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>${s.answered?`<div class="feedback ${s.chosen===correct?'good':'bad'}"><b>${s.chosen===correct?'Верно! ✓':'Пока неверно.'}</b><div style="margin-top:5px">${esc(explanation)}</div></div><button class="primary" onclick="nextQuestion()">${s.index+1===s.items.length?'Завершить':'Следующий вопрос →'}</button>`:""}</div>`)}
function answerSession(choice){if(!session||session.answered)return;const s=session;s.chosen=choice;s.answered=true;const c=s.current,ok=choice===c.correct;if(ok)s.correct++;s.answers.push({ok,question:c.question});if(c.word)noteAnswer(c.word,ok);else{markStudy();p().history.push({grammar:true,ok,date:today()});save()}renderQuestionSession(page)}
function nextQuestion(){if(!session)return;session.index++;session.answered=false;delete session.chosen;renderQuestionSession(page)}
function finishSession(){const s=session;if(!s)return;const total=s.items.length,correct=s.correct,pct=Math.round(correct/total*100);if(s.kind==="test"||s.kind==="word"){p().tests.push({label:s.kind==="test"?"Быстрый тест":"Тест слов",date:today(),correct,total,level:p().level});addAchievement("test1");if(p().tests.length>=5)addAchievement("test5")}p().lessons.push({id:"session-"+Date.now(),date:today()});markStudy();addAchievement("first");if(dayStreak()>=3)addAchievement("streak3");if(dayStreak()>=7)addAchievement("streak7");save();session=null;const advice=pct>=90?"Отлично! Попробуй следующий уровень или повтори сложные слова.":pct>=70?"Хороший результат. Повтори ошибки, чтобы закрепить материал.":"Это полезная диагностика. Повтори слова и правила, затем попробуй снова.";main(`${pageHead("Результат","Твой прогресс — это регулярная практика.")}<div class="card empty"><div style="font-size:48px">${pct>=80?"🎉":pct>=60?"👏":"🌱"}</div><strong style="font-size:24px">${correct} из ${total} · ${pct}%</strong><p>${esc(advice)}</p><div class="progressbar" style="max-width:400px;margin:18px auto"><i style="width:${pct}%"></i></div><button class="primary" onclick="go('home')">На главную</button> <button class="soft" onclick="${s.kind==='grammar'?'startGrammar()':s.kind==='word'?'startWordQuiz()':'startTest()'}">Пройти ещё раз</button></div>`)}
function quitSession(){if(confirm("Выйти из занятия? Текущий незавершённый результат не будет засчитан.")){session=null;go(page==="grammar"?"grammar":page==="vocab"?"vocab":"tests")}}
function situationsPage(){const names=Object.keys(situations);const phrases=situations[situationName]||situations[names[0]];main(`${pageHead("Практические ситуации","Полезный английский для реальной жизни")}<div class="tabs">${names.map(n=>`<button class="tab ${n===situationName?'active':''}" onclick="situationName=${JSON.stringify(n)};situationIndex=0;render()">${esc(n)}</button>`).join("")}</div><div class="card situation"><h2 style="margin-top:0">${esc(situationName)}</h2>${phrases.map((f,i)=>`<div class="phrase"><b>${esc(f[0])}</b><p>${esc(f[1])}</p></div>`).join("")}<div class="section-title"><div><h2>Мини-тест</h2><p>Выбери правильный перевод фразы</p></div></div>${renderSituationQuiz()}</div>`)}
function renderSituationQuiz(){const list=situations[situationName],q=list[situationIndex%list.length],opts=shuffle([q[1],...shuffle(Object.values(situations).flat().filter(x=>x[1]!==q[1]).map(x=>x[1])).slice(0,2)]);return `<p><b>${esc(q[0])}</b></p><div class="options">${opts.map(o=>`<button class="option" onclick="situationAnswer(${JSON.stringify(o).replace(/"/g,'&quot;')},${JSON.stringify(q[1]).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join("")}</div><p class="muted" style="font-size:12px">Вопрос ${situationIndex%list.length+1} из ${list.length}</p>`}

function progressPage(){const total=p().tests.reduce((a,t)=>a+t.total,0),correct=p().tests.reduce((a,t)=>a+t.correct,0),pct=total?Math.round(correct/total*100):0;const streak=dayStreak();main(`${pageHead("Мой прогресс","Все достижения и результаты профиля ${PEOPLE[profile].name}")}<div class="grid"><div class="card stat"><div class="ico">📚</div><div class="num">${p().learned.length}</div><div class="label">Выучено слов</div></div><div class="card stat"><div class="ico">📝</div><div class="num">${p().tests.length}</div><div class="label">Завершено тестов</div></div><div class="card stat"><div class="ico">🔥</div><div class="num">${streak}</div><div class="label">Дней подряд</div></div></div><div class="section-title"><div><h2>Опыт и прогресс</h2><p>Опыт начисляется за занятия и достижения</p></div><span class="badge">${p().xp||0} XP</span></div><div class="card"><b>Уровень ученика: ${1+Math.floor((p().xp||0)/100)}</b><p class="muted">До следующего уровня: ${100-((p().xp||0)%100)} XP</p><div class="progressbar"><i style="width:${(p().xp||0)%100}%"></i></div></div><div class="section-title"><div><h2>Точность тестов</h2><p>${correct} правильных ответов из ${total}</p></div><span class="badge">${pct}%</span></div><div class="card"><div class="progressbar"><i style="width:${pct}%"></i></div><p class="muted">Текущий уровень: <b>${p().level} · ${LEVELS[p().level]}</b>. Прогресс разных профилей хранится отдельно.</p></div><div class="section-title"><div><h2>Достижения</h2><p>Каждое достижение выдаётся только один раз</p></div><span class="badge">${p().achievements.length} / ${Object.keys(ACH).length}</span></div><div class="grid two">${Object.entries(ACH).map(([id,a])=>`<div class="achievement ${p().achievements.includes(id)?'':'locked'}"><div class="medal">${a.emoji}</div><div><b>${a.name} ${p().achievements.includes(id)?'✓':''}</b><small>${a.desc}</small></div></div>`).join("")}</div><div class="section-title"><div><h2>Последние тесты</h2><p>История выбранного профиля</p></div></div><div class="card">${p().tests.length?[...p().tests].reverse().slice(0,8).map(t=>`<div class="listrow"><div><b>${esc(t.label)}</b><div class="muted" style="font-size:12px">${esc(t.date)} · ${t.level}</div></div><span class="badge">${t.correct}/${t.total} · ${Math.round(t.correct/t.total*100)}%</span></div>`).join(""):`<div class="empty"><strong>Пока нет результатов</strong>Пройди быстрый тест, чтобы увидеть статистику.</div>`}</div>`)}
let sentenceCurrent=null, sentenceChosen=[], sentenceFeedback="", sentencePool=[], listeningCurrent=null;
function dailyPlanPage(){const done=p().lessons.filter(x=>x.date===today()).length, goal=p().goal, remaining=Math.max(0,goal-done);return `<div class="card"><div class="eyebrow" style="color:#68718b">ПЛАН НА СЕГОДНЯ</div><h2 style="margin:8px 0">${remaining?"Небольшая практика — и цель ближе":"Цель на сегодня выполнена! 🎉"}</h2><p class="muted">План адаптируется к уровню ${p().level} и твоим словам на повторение.</p><div class="progressbar"><i style="width:${Math.min(100,done/goal*100)}%"></i></div><p class="muted">${Math.min(done,goal)} из ${goal} действий · ${remaining} осталось</p><div class="grid two"><button class="path-card" onclick="startVocab(dueWords().length?'due':'new')"><div class="path-ico">🔁</div><div><b>1. Слова</b><span>${dueWords().length} слов на повторение · ${newWords().length} новых</span></div></button><button class="path-card" onclick="go('grammar')"><div class="path-ico">✍️</div><div><b>2. Грамматика</b><span>Несколько заданий уровня ${p().level}</span></div></button><button class="path-card" onclick="go('practice');startListening()"><div class="path-ico">🎧</div><div><b>3. Послушай фразу</b><span>Тренировка понимания речи</span></div></button><button class="path-card" onclick="go('tests');startTest()"><div class="path-ico">⚡</div><div><b>4. Мини-тест</b><span>Проверь, что запомнилось</span></div></button></div></div>`}
function practicePage(){const w=sentenceCurrent||currentWords()[0];main(`${pageHead("Практика","Аудирование и составление предложений · уровень ${p().level}")}<div class="tabs"><button class="tab active" onclick="startListening()">🎧 Аудирование</button><button class="tab" onclick="startSentence()">🧩 Собрать предложение</button><button class="tab" onclick="go('situations')">💬 Диалоги</button></div><div class="grid two"><div class="card"><div class="path-ico">🎧</div><h2>Аудирование</h2><p class="muted">Прослушай английскую фразу, затем выбери правильный перевод. Озвучка зависит от поддержки браузера и установленных голосов.</p>${listeningCurrent?`<div class="question">${esc(listeningCurrent[0])}</div><button class="primary" onclick="speakPhrase()">▶ Прослушать ещё раз</button><div class="options">${listeningOptions().map(o=>`<button class="option" onclick="answerListening(${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join("")}</div>`:`<button class="primary" onclick="startListening()">Начать аудирование</button>`}</div><div class="card"><div class="path-ico">🧩</div><h2>Собери предложение</h2><p class="muted">Нажимай на слова по порядку и проверь грамматику.</p>${sentenceCurrent?`<div class="notice">Перевод: ${esc(sentenceCurrent[3])}</div><div class="toolbar">${sentenceChosen.map((x,i)=>`<button class="soft small" onclick="removeSentenceWord(${i})">${esc(x)} ×</button>`).join("")}</div><div class="options">${sentenceTokens().map((x,i)=>`<button class="option" ${sentenceChosen.length===sentenceTokens().length?'disabled':''} onclick="chooseSentenceWord(${i})">${esc(x)}</button>`).join("")}</div>${sentenceFeedback?`<div class="feedback ${sentenceFeedback.startsWith('Верно')?'good':'bad'}">${esc(sentenceFeedback)}</div><button class="primary" onclick="startSentence()">Следующее предложение</button>`:`<button class="primary" onclick="checkSentence()">Проверить</button> <button class="plain" onclick="startSentence()">Пропустить</button>`}`:`<button class="primary" onclick="startSentence()">Начать тренировку</button>`}</div></div><div class="card" style="margin-top:14px"><b>💡 Совет</b><p class="muted" style="margin-bottom:0">Если озвучка не работает, это ограничение устройства или браузера, а не ошибка твоего ответа. Все остальные упражнения работают без платных сервисов.</p></div>`)}
function startListening(){const all=Object.values(words).flat().filter(x=>x);listeningCurrent=all[Math.floor(Math.random()*all.length)];page='practice';render();setTimeout(speakPhrase,100)}
function speakPhrase(){if(!listeningCurrent)return;if(!('speechSynthesis' in window)){toast('Озвучка не поддерживается этим браузером.');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(listeningCurrent[2]);u.lang='en-US';u.rate=.82;window.speechSynthesis.speak(u)}
function listeningOptions(){if(!listeningCurrent)return[];return shuffle([listeningCurrent[3],...shuffle(Object.values(words).flat().filter(w=>w[3]!==listeningCurrent[3]).map(w=>w[3])).slice(0,2)])}
function answerListening(choice){const ok=choice===listeningCurrent[3];if(ok){p().xp=(p().xp||0)+3;markStudy();toast('Верно! + опыт')}else toast('Правильный перевод: '+listeningCurrent[3]);p().history.push({listening:true,ok,date:today(),word:listeningCurrent[0]});save();listeningCurrent=null;render()}
function startSentence(){const pool=currentWords();sentenceCurrent=pool[Math.floor(Math.random()*pool.length)];sentenceChosen=[];sentenceFeedback='';sentencePool=shuffle(sentenceCurrent[2].replace(/[.!?]$/,'').split(/\s+/));page='practice';render()}
function sentenceTokens(){return sentencePool}
function chooseSentenceWord(i){if(i<0||i>=sentencePool.length)return;sentenceChosen.push(sentencePool.splice(i,1)[0]);render()}
function removeSentenceWord(i){if(i<0||i>=sentenceChosen.length)return;const word=sentenceChosen.splice(i,1)[0];sentencePool.push(word);sentenceFeedback='';render()}
function checkSentence(){if(!sentenceCurrent||sentenceChosen.length===0){toast('Сначала выбери слова предложения.');return}const norm=x=>x.toLowerCase().replace(/[.!?]/g,'').replace(/\s+/g,' ').trim();const ok=norm(sentenceChosen.join(' '))===norm(sentenceCurrent[2]);sentenceFeedback=ok?'Верно! Отличный порядок слов.':'Пока не совсем. Правильный вариант: '+sentenceCurrent[2];const key=sentenceCurrent[0];p().sentenceStats[key]=p().sentenceStats[key]||{attempts:0,correct:0};p().sentenceStats[key].attempts++;if(ok){p().sentenceStats[key].correct++;p().xp=(p().xp||0)+5;markStudy()}p().history.push({sentence:true,ok,date:today(),word:key});save();render()}
function exportBackup(){const payload={app:'EnglishBoost',version:1,exportedAt:new Date().toISOString(),profiles:store};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='EnglishBoost-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Резервная копия подготовлена')}
function importBackup(input){const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);const profiles=data.profiles||data;if(!profiles.me||!profiles.mom||!profiles.sis)throw new Error('Файл не содержит все три профиля');if(!confirm('Импорт заменит прогресс всех трёх профилей данными из файла. Продолжить?'))return;for(const id of Object.keys(PEOPLE))store[id]=Object.assign(fresh(),profiles[id]);save();toast('Прогресс восстановлен');render()}catch(e){toast('Не удалось импортировать файл EnglishBoost')}input.value=''};reader.readAsText(file)}
function settingsPage(){if(session&&session.kind==="level"){renderLevelQuestion();return}main(`${pageHead("Настройки","Персонализируй занятия для профиля ${PEOPLE[profile].name}")}<div class="card"><h2 style="margin-top:0">Уровень английского</h2><p class="muted">Меняй уровень в любой момент. Пройденные слова и результаты сохранятся.</p><div class="levelgrid">${Object.entries(LEVELS).map(([l,n])=>`<button class="levelbtn ${p().level===l?'selected':''}" onclick="setLevel('${l}')"><b>${l}</b><small>${n}</small></button>`).join("")}</div><div class="section-title"><div><h2>Определить примерный уровень</h2><p>Короткая диагностика из 5 вопросов; это не официальная оценка CEFR.</p></div></div><button class="primary" onclick="startLevelTest()">Пройти тест уровня</button></div><div class="section-title"><div><h2>План на сегодня</h2><p>Короткий маршрут под твой уровень</p></div><button class="soft small" onclick="dailyPlan()">Открыть план</button></div><div class="section-title"><div><h2>Ежедневная цель</h2><p>Сколько учебных действий хочется сделать в день</p></div></div><div class="card"><label for="goal">Цель: <b>${p().goal}</b> действий в день</label><div style="display:flex;gap:12px;align-items:center;margin-top:12px"><input id="goal" type="range" min="3" max="30" value="${p().goal}" style="flex:1" oninput="document.getElementById('goalValue').textContent=this.value" onchange="setGoal(this.value)"><span id="goalValue">${p().goal}</span></div></div><div class="section-title"><div><h2>Резервная копия</h2><p>Сохрани прогресс в файл или восстанови его</p></div></div><div class="card"><p class="muted">Экспортируй данные перед сменой устройства. Файл содержит прогресс всех трёх профилей.</p><div class="toolbar"><button class="soft" onclick="exportBackup()">Скачать резервную копию</button><label class="primary" style="display:inline-block;cursor:pointer">Восстановить из файла<input type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this)"></label></div></div><div class="section-title"><div><h2>Данные профиля</h2><p>Сброс затронет только выбранный профиль: ${PEOPLE[profile].name}.</p></div></div><div class="card"><p class="muted">Словарь, история ответов, тесты и достижения сохраняются локально в этом браузере. Очистка данных браузера может удалить прогресс.</p><button class="danger" onclick="resetProfile()">Сбросить прогресс профиля «${PEOPLE[profile].name}»</button></div>`)}
function setLevel(l){p().level=l;save();toast("Уровень изменён на "+l);render()}
function setGoal(v){p().goal=Number(v);save();render()}
function startLevelTest(){const qs=Object.keys(grammar).flatMap(l=>grammar[l].slice(0,5).map(q=>({q,level:l})));session={kind:"level",items:shuffle(qs).slice(0,5),index:0,correct:0,answers:[],answered:false,byLevel:{A1:0,A2:0,B1:0,B2:0,C1:0}};page="settings";render()}
function levelAnswer(choice){const s=session;if(!s||s.answered)return;s.chosen=choice;s.answered=true;const it=s.items[s.index];if(choice===it.q[1]){s.correct++;s.byLevel[it.level]++}renderLevelQuestion()}
function renderLevelQuestion(){const s=session;if(!s)return;const it=s.items[s.index];const q=it.q,opts=shuffle([q[1],q[2],q[3]]);main(`${pageHead("Тест уровня","Вопрос "+(s.index+1)+" из "+s.items.length)}<div class="card" style="max-width:700px;margin:auto"><div class="notice">Это короткая ориентировочная диагностика, не официальный сертификат CEFR.</div><div class="progressbar"><i style="width:${s.index/s.items.length*100}%"></i></div><div class="question">${esc(q[0])}</div><div class="options">${opts.map(o=>`<button class="option ${s.answered?(o===q[1]?'correct':o===s.chosen?'wrong':''):''}" ${s.answered?'disabled':''} onclick="levelAnswer(${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join("")}</div>${s.answered?`<div class="feedback ${s.chosen===q[1]?'good':'bad'}">${esc(q[5])}</div><button class="primary" onclick="nextLevelQuestion()">${s.index===s.items.length-1?'Узнать результат':'Следующий вопрос →'}</button>`:""}</div>`)}
function nextLevelQuestion(){session.index++;session.answered=false;if(session.index>=session.items.length){const s=session;let level=s.correct<=1?"A1":s.correct===2?"A2":s.correct===3?"B1":s.correct===4?"B2":"C1";session=null;main(`${pageHead("Результат диагностики","Тест завершён") }<div class="card empty"><div style="font-size:48px">🧭</div><strong>Предварительный ориентир: ${level} · ${LEVELS[level]}</strong><p>Ты ответил(а) правильно на ${s.correct} из ${s.items.length} вопросов. Тест короткий и не является официальной оценкой CEFR. Выбери рекомендуемый уровень или продолжи с текущим.</p><button class="primary" onclick="setLevel('${level}')">Выбрать ${level}</button> <button class="soft" onclick="go('settings')">Оставить текущий</button></div>`);return}renderLevelQuestion()}
function resetProfile(){if(confirm("Сбросить весь прогресс только профиля «"+PEOPLE[profile].name+"»? Это действие нельзя отменить.")){store[profile]=fresh();save();session=null;toast("Прогресс профиля сброшен");render()}}
document.getElementById("profileSelect").addEventListener("change",e=>{profile=e.target.value;session=null;page="home";render()});
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
const oldRenderQuestionSession=renderQuestionSession;
renderQuestionSession=function(which){if(session&&session.kind==="level"){renderLevelQuestion();return}oldRenderQuestionSession(which)};
window.addEventListener("storage",()=>{store=loadStore();render()});
render();
</script>
</body></html>
