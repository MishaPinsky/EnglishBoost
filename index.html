/* EnglishBoost Editorial polish */
:root{--bg:#f4f1e8;--card:#fffdf8;--ink:#20362d;--muted:#68766d;--blue:#285c49;--purple:#b97855;--line:#e3dfd2;--green:#287a5d;--red:#b84b52;--shadow:0 16px 42px rgba(32,54,45,.065);--accent-soft:#e9f0e8}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em;background:radial-gradient(ellipse at 12% 0%,rgba(219,228,211,.45),transparent 34%),var(--bg)}
.app{max-width:1320px;padding:24px clamp(12px,2.6vw,32px)}
.topbar{padding:6px 0 18px;border-bottom:1px solid rgba(120,132,113,.2);margin-bottom:22px}
.brand{letter-spacing:-.9px}.logo{border-radius:13px;background:var(--blue);box-shadow:none}.brand .muted{color:#78847a!important}
.sidebar{border-radius:17px;padding:10px;background:rgba(255,253,248,.82);box-shadow:0 8px 26px rgba(32,54,45,.035)}
.navbtn{color:#65736a;border-radius:10px;font-weight:600}.navbtn.active{background:#e6eee4;color:#214b3a}.navbtn:hover{background:#f0f1e9;color:var(--ink)}
.card,.sidebar{border-color:rgba(170,166,146,.38)}.card{border-radius:18px;box-shadow:0 10px 30px rgba(32,54,45,.035)}
.hero{background:linear-gradient(118deg,#203b30 0%,#315d47 72%,#3e7057 100%);border-radius:22px;box-shadow:0 18px 38px rgba(32,54,45,.12)}
.hero .primary{background:#fffdf8;color:#234b39}.hero .primary:hover{background:#e8efe5}.hero p{color:#e8eee6}.hero:after{border-color:#ffffff12}
.section-title{margin-top:28px}.section-title h2{font-size:clamp(19px,2vw,23px);letter-spacing:-.7px}.pagehead h1{font-size:clamp(26px,3vw,34px);letter-spacing:-1px}.pagehead p{max-width:700px}
button{transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}button:active{transform:translateY(1px)}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #bd8b68;outline-offset:3px}
.primary{background:var(--blue)}.primary:hover{background:#1f4938}.soft{background:#e9eee5;color:#28513d}.plain{background:#f1eee5;color:#4c5b51}.path-card{background:#fffdf8;border-radius:15px}.path-card:hover{border-color:#a9bca9;box-shadow:0 8px 20px rgba(32,54,45,.06)}
.stat .ico,.path-ico{background:#e9eee5}.badge,.word-level{background:#eee8dc;color:#77543e}.tab{background:#f0eee6;color:#68766d}.tab.active{background:#e6eee4;color:#28513d}.option:hover{border-color:#8ca993;background:#fbfcf7}
.editorial-art{background:linear-gradient(135deg,#f0eee4,#e7ede3);border:1px solid #e1e2d6}.illustration-choice{width:100%;text-align:left;color:var(--ink);justify-content:flex-start}.illustration-choice.selected{background:#e8f0e5;border-color:#70947a}.illustration-preview{flex-shrink:0;background:#e8eee4}.illustration-preview svg{width:100%;height:100%;max-width:62px;max-height:52px}
.inline-input,textarea{font:inherit;border:1px solid var(--line);border-radius:12px;background:#fffefa;color:var(--ink);padding:12px;width:100%}textarea{resize:vertical;min-height:150px;line-height:1.6}.writing-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px}.skill-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(150px,.7fr);gap:20px;align-items:center}.skill-hero .editorial-art{margin:0;min-height:175px}.reading-copy{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.8;letter-spacing:0;color:#35483c}.writing-prompt{border-left:3px solid #b97855;padding:4px 0 4px 15px;margin:14px 0}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.small-label{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#8b755f}

const ACH={first:{name:"Первый шаг",emoji:"🌱",desc:"Завершить первый урок"},streak3:{name:"В ритме",emoji:"🔥",desc:"Заниматься 3 дня подряд"},streak7:{name:"Неделя практики",emoji:"🗓️",desc:"Заниматься 7 дней подряд"},test1:{name:"Проверка знаний",emoji:"🎯",desc:"Завершить первый тест"},test5:{name:"Тест-марафон",emoji:"🏅",desc:"Завершить 5 тестов"},words10:{name:"Собиратель слов",emoji:"📚",desc:"Выучить 10 слов"}};
function dayStreak(){const ds=[...p().days].sort().reverse();if(!ds.length)return 0;let d=new Date(today()+"T12:00:00"), first=ds[0];if(first!==today()){d.setDate(d.getDate()-1);if(ds[0]!==d.toISOString().slice(0,10))return 0}let n=0;for(;;){const key=d.toISOString().slice(0,10);if(ds.includes(key)){n++;d.setDate(d.getDate()-1)}else break}return n}
function currentWords(){return words[p().level]}
function statWord(id){return p().wordStats[id]||(p().wordStats[id]={seen:0,correct:0,wrong:0,due:null,interval:0,history:[]})}
function weightedWords(list){return [...list].sort((a,b)=>{let A=statWord(a[0]),B=statWord(b[0]);let aw=(A.wrong+1)/(A.correct+A.wrong+1),bw=(B.wrong+1)/(B.correct+B.wrong+1);return (bw-aw)+(Math.random()-.5)*.8})}
function dueWords(){const now=today();return Object.values(words).flat().filter(w=>{let s=statWord(w[0]);return s.seen>0&&(!s.due||s.due<=now)})}
function newWords(){return currentWords().filter(w=>!p().wordStats[w[0]]||!p().wordStats[w[0]].seen)}
function wordId(w){return w[0]}
function wordKnown(w){if(!p().learned.includes(w[0]))p().learned.push(w[0]);const s=statWord(w[0]);s.seen++;s.correct++;s.interval=Math.min((s.interval||0)+1,14);s.due=new Date(Date.now()+s.interval*86400000).toISOString().slice(0,10);s.history.push({date:today(),ok:true});p().lessons.push({id:"word-"+w[0],date:today()});markStudy();addAchievement("first");if(p().learned.length>=10)addAchievement("words10");save()}
function noteAnswer(w,ok){const s=statWord(w[0]);s.seen++;if(ok){s.correct++;s.interval=Math.min(Math.max(1,(s.interval||0)*2),30)}else{s.wrong++;s.interval=1} s.due=new Date(Date.now()+s.interval*86400000).toISOString().slice(0,10);s.history.push({date:today(),ok});p().history.push({word:w[0],ok,date:today()});markStudy();save()}

function wordAnswer(ok){const w=vocabList[vocabIndex];noteAnswer(w,ok);if(ok&&!p().learned.includes(w[0]))p().learned.push(w[0]);if(p().learned.length>=10)addAchievement("words10");vocabIndex++;vocabReveal=false;if(vocabIndex>=vocabList.length){addAchievement("first");if(dayStreak()>=3)addAchievement("streak3");if(dayStreak()>=7)addAchievement("streak7");save();main(`${pageHead("Отличная работа!","Сессия повторения завершена")}<div class="card empty"><strong>Ты завершил(а) ${vocabList.length} карточек.</strong>Ответы сохранены, а сложные слова появятся в повторении раньше.<p><button class="primary" onclick="go('home')">На главную</button> <button class="soft" onclick="startVocab('due')">Повторить ещё</button></p></div>`);return}render()}
function startWordQuiz(){const list=weightedWords(currentWords()).slice(0,Math.min(10,currentWords().length));session={kind:"word",items:list.map(w=>({type:"word",w})),index:0,correct:0,answers:[],answered:false};vocabMode="quiz";page="vocab";render()}
function grammarPage(){if(session&&session.kind==="grammar"){renderQuestionSession("grammar");return}const qs=grammar[p().level];main(`${scene("grammar")} ${pageHead("Грамматика",`Практикуй правила уровня ${p().level} — ${LEVELS[p().level]}`,`<span class="badge">${qs.length} заданий</span>`)}<div class="card"><div class="eyebrow" style="color:#69718b">УРОВЕНЬ ${p().level}</div><h2 style="margin:8px 0">Закрепляй правило на практике</h2><p class="muted">Выбирай ответ, а EnglishBoost объяснит правило по-русски. Прогресс сохраняется в твоём профиле.</p><div class="grid two"><div class="card" style="box-shadow:none;background:#f8f9ff"><div class="ico">✍️</div><b>${qs.length} грамматических вопросов</b><p class="muted" style="font-size:13px">От базовых конструкций до продвинутых нюансов.</p></div><div class="card" style="box-shadow:none;background:#f8f9ff"><div class="ico">💡</div><b>Объяснение каждого ответа</b><p class="muted" style="font-size:13px">Разбирайся в правиле, а не просто угадывай.</p></div></div><p><button class="primary" onclick="startGrammar()">Начать упражнения →</button></p></div>`)}
function startGrammar(){session={kind:"grammar",items:shuffle(grammar[p().level].map((q,i)=>({type:"grammar",q,id:p().level+"-g"+i}))),index:0,correct:0,answers:[],answered:false};render()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startTest(){let pool=[];currentWords().forEach(w=>pool.push({type:"word",w}));grammar[p().level].forEach((q,i)=>pool.push({type:"grammar",q,id:p().level+"-g"+i}));session={kind:"test",items:shuffle(pool).slice(0,10),index:0,correct:0,answers:[],answered:false};page="tests";render()}
function testsPage(){if(session&&session.kind==="test"){renderQuestionSession("tests");return}let recent=p().tests.slice(-5).reverse();main(`${scene("tests")} ${pageHead("Быстрые тесты","Смешанные задания по словарю и грамматике",`<span class="badge">${p().level}</span>`)}<div class="card"><div class="path-ico">⚡</div><h2>Проверь знания за несколько минут</h2><p class="muted">10 уникальных вопросов из словаря и грамматики твоего уровня. В одном тесте вопрос не повторяется.</p><button class="primary" onclick="startTest()">Начать тест · 10 вопросов</button></div><div class="section-title"><div><h2>История тестов</h2><p>Результаты этого профиля</p></div></div><div class="card">${recent.length?recent.map(t=>`<div class="listrow"><div><b>${esc(t.label)}</b><div class="muted" style="font-size:12px">${esc(t.date)} · ${t.correct} из ${t.total} правильных</div></div><span class="badge">${Math.round(t.correct/t.total*100)}%</span></div>`).join(""):`<div class="empty"><strong>Тестов пока нет</strong>Заверши первый тест, и результат появится здесь.</div>`}</div>`)}
function renderQuestionSession(which){if(!session)return;const s=session;if(s.index>=s.items.length){finishSession();return}const item=s.items[s.index],isWord=item.type==="word";let question,correct,options,explanation,word;if(isWord){word=item.w;question=`Как переводится “${word[0]}”?`;correct=word[1];options=shuffle([correct,...shuffle(currentWords().filter(w=>w[0]!==word[0]).map(w=>w[1])).slice(0,3)]);explanation=`${word[0]} — ${word[1]}. Пример: ${word[2]} — ${word[3]}.`}else{const q=item.q;question=q[0];correct=q[1];options=shuffle([q[1],q[2],q[3]]);explanation=q[5]}
s.current={item,question,correct,options,explanation,word};
const title=s.kind==="grammar"?"Грамматическая практика":s.kind==="word"?"Тест слов":"Быстрый тест";
main(`${pageHead(title,`Вопрос ${s.index+1} из ${s.items.length}`,`<button class="plain small" onclick="quitSession()">Выйти</button>`)}<div class="card" style="max-width:760px;margin:auto"><div class="progressbar"><i style="width:${s.index/s.items.length*100}%"></i></div><div class="eyebrow" style="color:#7b84a0;margin-top:20px">${isWord?"СЛОВАРЬ":"ГРАММАТИКА"} · ${p().level}</div><div class="question">${esc(question)}</div><div class="options">${options.map((o,i)=>`<button class="option ${s.answered?(o===correct?'correct':o===s.chosen?'wrong':''):''}" ${s.answered?'disabled':''} onclick="answerSession(${JSON.stringify(o).replace(/"/g,'&quot;')})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>${s.answered?`<div class="feedback ${s.chosen===correct?'good':'bad'}"><b>${s.chosen===correct?'Верно! ✓':'Пока неверно.'}</b><div style="margin-top:5px">${esc(explanation)}</div></div><button class="primary" onclick="nextQuestion()">${s.index+1===s.items.length?'Завершить':'Следующий вопрос →'}</button>`:""}</div>`)}
function answerSession(choice){if(!session||session.answered)return;const s=session;s.chosen=choice;s.answered=true;const c=s.current,ok=choice===c.correct;if(ok)s.correct++;s.answers.push({ok,question:c.question});if(c.word)noteAnswer(c.word,ok);else{markStudy();p().history.push({grammar:true,ok,date:today()});save()}renderQuestionSession(page)}
function nextQuestion(){if(!session)return;session.index++;session.answered=false;delete session.chosen;renderQuestionSession(page)}
function finishSession(){const s=session;if(!s)return;const total=s.items.length,correct=s.correct,pct=Math.round(correct/total*100);if(s.kind==="test"||s.kind==="word"){p().tests.push({label:s.kind==="test"?"Быстрый тест":"Тест слов",date:today(),correct,total,level:p().level});addAchievement("test1");if(p().tests.length>=5)addAchievement("test5")}p().lessons.push({id:"session-"+Date.now(),date:today()});markStudy();addAchievement("first");if(dayStreak()>=3)addAchievement("streak3");if(dayStreak()>=7)addAchievement("streak7");save();session=null;const advice=pct>=90?"Отлично! Попробуй следующий уровень или повтори сложные слова.":pct>=70?"Хороший результат. Повтори ошибки, чтобы закрепить материал.":"Это полезная диагностика. Повтори слова и правила, затем попробуй снова.";main(`${pageHead("Результат","Твой прогресс — это регулярная практика.")}<div class="card empty"><div style="font-size:48px">${pct>=80?"🎉":pct>=60?"👏":"🌱"}</div><strong style="font-size:24px">${correct} из ${total} · ${pct}%</strong><p>${esc(advice)}</p><div class="progressbar" style="max-width:400px;margin:18px auto"><i style="width:${pct}%"></i></div><button class="primary" onclick="go('home')">На главную</button> <button class="soft" onclick="${s.kind==='grammar'?'startGrammar()':s.kind==='word'?'startWordQuiz()':'startTest()'}">Пройти ещё раз</button></div>`)}
function quitSession(){if(confirm("Выйти из занятия? Текущий незавершённый результат не будет засчитан.")){session=null;go(page==="grammar"?"grammar":page==="vocab"?"vocab":"tests")}}
function situationsPage(){const names=Object.keys(situations);const phrases=situations[situationName]||situations[names[0]];main(`${scene("situations")} ${pageHead("Практические ситуации","Полезный английский для реальной жизни")}<div class="tabs">${names.map(n=>`<button class="tab ${n===situationName?'active':''}" onclick="situationName=${JSON.stringify(n)};situationIndex=0;render()">${esc(n)}</button>`).join("")}</div><div class="card situation"><h2 style="margin-top:0">${esc(situationName)}</h2>${phrases.map((f,i)=>`<div class="phrase"><b>${esc(f[0])}</b><p>${esc(f[1])}</p></div>`).join("")}<div class="section-title"><div><h2>Мини-тест</h2><p>Выбери правильный перевод фразы</p></div></div>${renderSituationQuiz()}</div>`)}
function renderSituationQuiz(){const list=situations[situationName],q=list[situationIndex%list.length],opts=shuffle([q[1],...shuffle(Object.values(situations).flat().filter(x=>x[1]!==q[1]).map(x=>x[1])).slice(0,2)]);return `<p><b>${esc(q[0])}</b></p><div class="options">${opts.map(o=>`<button class="option" onclick="situationAnswer(${JSON.stringify(o).replace(/"/g,'&quot;')},${JSON.stringify(q[1]).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join("")}</div><p class="muted" style="font-size:12px">Вопрос ${situationIndex%list.length+1} из ${list.length}</p>`}
function situationAnswer(choice,correct){if(choice===correct){toast("Верно! Хорошая работа.");p().lessons.push({id:"situation-"+situationName+"-"+situationIndex+"-"+today(),date:today()});markStudy();addAchievement("first");save()}else toast("Не совсем. Правильный перевод: "+correct);situationIndex++;render()}
const READING_TEXTS=[
{id:"a1-morning",level:"A1",title:"A quiet morning",type:"Everyday life",art:"book",text:"Emma gets up at seven o’clock. She opens the window and makes a cup of tea. Then she reads a few pages of her book before school. She likes quiet mornings because they help her feel ready for the day.",question:"Why does Emma like quiet mornings?",options:["They help her feel ready for the day.","She can sleep until noon.","She has no books to read."],answer:0,explain:"The text says quiet mornings help Emma feel ready for the day."},
{id:"a2-city",level:"A2",title:"A city worth exploring",type:"Travel",art:"talk",text:"When Leo visited Bristol, he decided to explore the city on foot. He discovered a small bookshop near the harbour and spoke to the owner, who recommended a local history museum. By the end of the afternoon, Leo had found places he would never have noticed on a bus.",question:"What helped Leo discover unexpected places?",options:["Taking a guided bus tour","Exploring the city on foot","Reading a travel advert"],answer:1,explain:"Walking gave Leo time to notice small places and talk to local people."},
{id:"b1-community",level:"B1",title:"The value of community spaces",type:"Society",art:"write",text:"Public libraries are changing, but their purpose remains important. Alongside books, many now provide quiet study areas, digital resources and events where neighbours can meet. These services matter because access to learning should not depend entirely on a person’s income or home environment. A well-supported library can therefore strengthen an entire community.",question:"What is the main argument of the passage?",options:["Libraries should only lend books.","Libraries can make learning more accessible and connect people.","Digital resources have made libraries unnecessary."],answer:1,explain:"The passage argues that libraries widen access to learning and support communities."},
{id:"b2-learning",level:"B2",title:"Learning beyond the classroom",type:"Education",art:"listen",text:"Formal lessons provide structure, yet lasting progress often depends on what learners do between classes. Short retrieval sessions, deliberate practice and reflection can help new knowledge become more durable. The aim is not to maximise study time at any cost, but to make practice purposeful: identify a gap, choose a suitable task and revisit the result later.",question:"According to the passage, effective independent learning should…",options:["replace all formal lessons","focus on purposeful practice and later review","always involve longer study sessions"],answer:1,explain:"The text recommends targeted practice followed by reflection and review."},
{id:"c1-evidence",level:"C1",title:"Evidence and interpretation",type:"Critical thinking",art:"book",text:"A persuasive argument does more than assemble facts; it explains why those facts support a particular conclusion. Evidence may be accurate yet insufficient, and a correlation may suggest a relationship without establishing causation. Careful readers therefore distinguish observation from inference, consider alternative explanations and ask whether the strength of a claim matches the strength of the evidence offered.",question:"Which distinction does the passage emphasise?",options:["The difference between evidence and opinionated writing styles","The difference between correlation and causation","The difference between reading quickly and slowly"],answer:1,explain:"The passage explicitly warns that correlation does not establish causation."},
{id:"a1-pet",level:"A1",title:"A new pet",type:"Everyday life",art:"talk",text:"Mia has a small dog called Pip. Every morning, she gives Pip some food and takes him to the park. Pip likes to run and play with a red ball. In the evening, he sleeps next to Mia’s chair.",question:"What does Pip like to play with?",options:["A red ball","A book","A blue hat"],answer:0,explain:"The passage says Pip likes to run and play with a red ball."},
{id:"a2-market",level:"A2",title:"Saturday at the market",type:"Everyday life",art:"write",text:"On Saturday, Nora went to the market with her grandfather. They bought fresh apples, bread and a bunch of flowers. The market was busy, but the people were friendly. Nora enjoyed talking to the flower seller, who gave her a useful tip about keeping roses fresh.",question:"What did the flower seller give Nora?",options:["A free lunch","A tip about roses","A map of the city"],answer:1,explain:"The flower seller shared advice about keeping roses fresh."},
{id:"b1-team",level:"B1",title:"Working as a team",type:"Education",art:"talk",text:"A group project can be frustrating when responsibilities are unclear. Teams usually work better when members agree on a shared goal, divide tasks fairly and check in regularly. Disagreements are not always a problem; when people explain their reasons respectfully, different perspectives can improve the final result.",question:"What can make disagreements useful?",options:["Avoiding all discussion","Explaining different views respectfully","Giving every task to one person"],answer:1,explain:"Respectful discussion lets different perspectives improve the result."},
{id:"b2-habits",level:"B2",title:"Small habits, lasting change",type:"Learning",art:"book",text:"Ambitious plans often fail when they rely on motivation alone. A more reliable approach is to make a desired action specific, connect it to an existing routine and reduce the effort needed to begin. Progress may seem modest at first, yet repeated actions can gradually reshape behaviour. Consistency, rather than intensity, is often the more sustainable measure of success.",question:"What does the passage recommend for sustainable progress?",options:["Waiting until motivation is high","Making actions manageable and consistent","Changing every routine at once"],answer:1,explain:"The passage emphasises specific, manageable actions repeated consistently."},
{id:"c1-public",level:"C1",title:"The public value of art",type:"Culture",art:"write",text:"Public investment in the arts is sometimes defended solely in terms of economic return, yet this framing is incomplete. Cultural institutions can generate employment and attract visitors, but they also preserve shared memory, create spaces for debate and expose audiences to unfamiliar perspectives. These benefits are harder to quantify, which does not make them insignificant; it simply requires evaluators to use a broader account of public value.",question:"Why does the author challenge a purely economic measure?",options:["Art never creates economic benefits","Some important cultural benefits are difficult to quantify","Visitors are the only audience that matters"],answer:1,explain:"The author argues that social and cultural benefits matter even when they are hard to measure."}
];
function readingText(){return READING_TEXTS.find(x=>x.id===readingOverride&&x.level===p().level)||READING_TEXTS.find(x=>x.level===p().level)||READING_TEXTS[0]}
function readingPage(){const t=readingText(),done=(p().readingCompleted||[]).includes(t.id);main(`${scene("reading")} ${pageHead("Чтение",`Короткие тексты по уровню ${p().level} с вопросом на понимание`,`<span class="badge">${t.level} · ${t.type}</span>`)}<div class="card skill-hero"><div><div class="small-label">READING ROOM · ${t.level}</div><h2 style="font-size:28px;letter-spacing:-.8px;margin:8px 0">${esc(t.title)}</h2><p class="muted">Прочитай текст один раз для общего смысла, затем перечитай и найди подтверждение ответа в тексте.</p><div class="toolbar"><button class="primary" onclick="checkReading()">Проверить понимание</button><button class="soft" onclick="nextReading()">Другой текст</button></div></div><div class="editorial-art">${art(t.art)}</div></div><div class="card" style="margin-top:14px"><p class="reading-copy">${esc(t.text)}</p><div class="section-title"><div><h2>Проверь понимание</h2><p>${esc(t.question)}</p></div></div><div class="options">${t.options.map((o,i)=>`<button class="option ${readingChoice===i&&readingFeedback?(i===t.answer?'correct':'wrong'):''}" ${readingFeedback?'disabled':''} onclick="readingChoice=${i};readingFeedback='';render()">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>${readingFeedback?`<div class="feedback ${readingChoice===t.answer?'good':'bad'}">${esc(t.explain)}</div>${readingChoice===t.answer?`<button class="primary" onclick="completeReading()">Отметить текст прочитанным ✓</button>`:`<button class="soft" onclick="readingChoice=null;readingFeedback='';render()">Попробовать ещё раз</button>`}`:""}<p class="muted" style="font-size:12px;margin-bottom:0">${done?'✓ Этот текст уже отмечен как прочитанный.':'Прогресс сохраняется отдельно в текущем профиле.'}</p></div>`)}
function checkReading(){if(readingChoice===null){toast("Сначала выбери ответ.");return}readingFeedback=true;render()}
function nextReading(){const idx=READING_TEXTS.findIndex(x=>x.id===readingText().id);const candidates=READING_TEXTS.filter(x=>x.level===p().level);const pool=READING_TEXTS.filter(x=>x.level===p().level);const safePool=pool.length?pool:READING_TEXTS;readingOverride=safePool[(Math.max(0,safePool.findIndex(x=>x.id===readingText().id)+1))%safePool.length].id;readingChoice=null;readingFeedback=false;render()}
function completeReading(){const t=readingText();p().readingCompleted=p().readingCompleted||[];if(!p().readingCompleted.includes(t.id)){p().readingCompleted.push(t.id);p().xp=(p().xp||0)+8;p().lessons.push({id:"reading-"+t.id,date:today()});markStudy();save();toast("Чтение завершено · +8 XP")}readingChoice=null;readingFeedback=false;render()}
const WRITING_PROMPTS=[
{level:"A1",id:"a1-intro",title:"Introduce yourself",brief:"Напиши 4–6 предложений о себе: имя, интересы, семья и любимое занятие.",starter:"My name is… I enjoy…",min:25,max:70,model:"My name is Alex. I live with my family. I enjoy reading and listening to music. At the weekend, I play football with my friends."},
{level:"A2",id:"a2-weekend",title:"A memorable weekend",brief:"Опиши прошедшие выходные. Используй Past Simple и минимум три временных маркера.",starter:"Last weekend, I… First,… Then,…",min:45,max:100,model:"Last weekend, I visited a small museum with my cousin. First, we explored the main exhibition. Then, we had lunch near the river. It was a relaxing day, and I learned something new."},
{level:"B1",id:"b1-opinion",title:"A skill worth learning",brief:"Объясни, какой навык полезно освоить подросткам. Приведи два аргумента и пример.",starter:"In my opinion,… One reason is… For example,…",min:80,max:150,model:"In my opinion, every teenager should learn how to manage their time. One reason is that planning reduces stress before deadlines. For example, dividing a large project into smaller tasks makes it easier to begin. It is also a useful skill for university and work."},
{level:"B2",id:"b2-essay",title:"Technology and attention",brief:"Напиши короткий аргументированный текст о том, помогает ли технология учиться или отвлекает. Покажи обе стороны и сформулируй вывод.",starter:"Although technology can…, it also… On balance,…",min:120,max:220,model:"Digital tools can make learning more accessible, as students can revisit explanations and practise at their own pace. However, notifications and constant switching between apps can interrupt concentration. The effect therefore depends less on technology itself than on how deliberately it is used. On balance, clear goals and limited distractions allow digital tools to support learning rather than replace sustained attention."},
{level:"C1",id:"c1-argument",title:"Should schools assess creativity?",brief:"Сформулируй тезис, рассмотрите контраргумент и сделай взвешенный вывод. Избегай категоричных утверждений.",starter:"A compelling case can be made that… Nevertheless,…",min:160,max:280,model:"A compelling case can be made for assessing creativity in schools, particularly when original thinking is central to a subject. A carefully designed assessment may reward experimentation, revision and the ability to justify decisions. Nevertheless, creativity is difficult to reduce to a single score, and rigid criteria may encourage students to produce work that appears original rather than take genuine intellectual risks. A balanced approach would combine a transparent rubric with reflective commentary and opportunities to revise. This would not eliminate subjectivity, but it could make the process more informative and fair."}

function writingPrompt(){return WRITING_PROMPTS.find(x=>x.level===p().level)||WRITING_PROMPTS[0]}
function saveWritingDraft(id,value){p().writingDrafts=p().writingDrafts||{};p().writingDrafts[id]=value;save();const counter=document.getElementById("writingCount");if(counter){const n=value.trim()?value.trim().split(/\s+/).length:0;counter.textContent=n+" слов"}}
function completeWriting(){const t=writingPrompt(),draft=(p().writingDrafts||{})[t.id]||"",count=draft.trim()?draft.trim().split(/\s+/).length:0;if(count<Math.min(t.min,15)){toast("Добавь немного текста перед завершением.");return}p().writingCompleted=p().writingCompleted||[];if(!p().writingCompleted.includes(t.id)){p().writingCompleted.push(t.id);p().xp=(p().xp||0)+10;p().lessons.push({id:"writing-"+t.id,date:today()});markStudy();save();toast("Черновик сохранён · +10 XP")}render()}
function writingPage(){const t=writingPrompt(),draft=(p().writingDrafts||{})[t.id]||"",count=draft.trim()?draft.trim().split(/\s+/).length:0,done=(p().writingCompleted||[]).includes(t.id);main(`${scene("writing")} ${pageHead("Письмо",`Тренируй ясность, структуру и аргументацию на уровне ${p().level}`,`<span class="badge">${t.min}–${t.max} слов · ${p().level}</span>`)}<div class="card skill-hero"><div><div class="small-label">WRITING STUDIO · ${p().level}</div><h2 style="font-size:28px;letter-spacing:-.8px;margin:8px 0">${esc(t.title)}</h2><p class="muted">${esc(t.brief)}</p><div class="writing-prompt"><span class="small-label">Начало, если трудно</span><p style="margin:5px 0 0">${esc(t.starter)}</p></div></div><div class="editorial-art">${art("write")}</div></div><div class="card" style="margin-top:14px"><label for="writingDraft"><b>Твой черновик</b></label><textarea id="writingDraft" placeholder="Пиши здесь на английском…" oninput="saveWritingDraft('${t.id}',this.value)">${esc(draft)}</textarea><div class="writing-meta"><span id="writingCount">${count} слов</span><span>Черновик сохраняется автоматически в этом профиле</span></div><div class="section-title"><div><h2>Самопроверка</h2><p>Перед завершением проверь три вещи</p></div></div><div class="checklist"><label><input type="checkbox"> Я ответил(а) на все части задания.</label><label><input type="checkbox"> Я проверил(а) времена, порядок слов и артикли.</label><label><input type="checkbox"> Я использовал(а) связки и перечитал(а) текст.</label></div><div class="toolbar" style="margin-top:16px"><button class="primary" onclick="completeWriting()">Сохранить как завершённую практику</button><button class="soft" onclick="toggleWritingModel()">${writingModelVisible?'Скрыть пример':'Посмотреть пример'}</button></div>${writingModelVisible?`<div class="notice" style="margin-top:14px"><b>Пример ответа</b><p style="margin-bottom:0">${esc(t.model)}</p><p style="margin:8px 0 0">Используй его как ориентир для структуры, а не как function levelAnswer(choice){const s=session;if(!s||s.answered)return;s.chosen=choice;s.answered=true;const it=s.items[s.index];if(choice===it.q[1]){s.correct++;s.byLevel[it.level]++}renderLevelQuestion()}
function renderLevelQuestion(){const s=session;if(!s)return;const it=s.items[s.index];const q=it.q,opts=shuffle([q[1],q[2],q[3]]);main(`${pageHead("Тест уровня","Вопрос "+(s.index+1)+" из "+s.items.length)}<div class="card" style="max-width:700px;margin:auto"><div class="notice">Это короткая ориентировочная диагностика, не официальный сертификат CEFR.</div><div class="progressbar"><i style="width:${s.index/s.items.length*100}%"></i></div><div class="question">${esc(q[0])}</div><div class="options">${opts.map(o=>`<button class="option ${s.answered?(o===q[1]?'correct':o===s.chosen?'wrong':''):''}" ${s.answered?'disabled':''} onclick="levelAnswer(${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join("")}</div>${s.answered?`<div class="feedback ${s.chosen===q[1]?'good':'bad'}">${esc(q[5])}</div><button class="primary" onclick="nextLevelQuestion()">${s.index===s.items.length-1?'Узнать результат':'Следующий вопрос →'}</button>`:""}</div>`)}
function nextLevelQuestion(){session.index++;session.answered=false;if(session.index>=session.items.length){const s=session;let level=s.correct<=1?"A1":s.correct===2?"A2":s.correct===3?"B1":s.correct===4?"B2":"C1";session=null;main(`${pageHead("Результат диагностики","Тест завершён") }<div class="card empty"><div style="font-size:48px">🧭</div><strong>Предварительный ориентир: ${level} · ${LEVELS[level]}</strong><p>Ты ответил(а) правильно на ${s.correct} из ${s.items.length} вопросов. Тест короткий и не является официальной оценкой CEFR. Выбери рекомендуемый уровень или продолжи с текущим.</p><button class="primary" onclick="setLevel('${level}')">Выбрать ${level}</button> <button class="soft" onclick="go('settings')">Оставить текущий</button></div>`);return}renderLevelQuestion()}
function resetProfile(){if(confirm("Сбросить весь прогресс только профиля «"+PEOPLE[profile].name+"»? Это действие нельзя отменить.")){store[profile]=fresh();save();session=null;toast("Прогресс профиля сброшен");render()}}
document.getElementById("profileSelect").addEventListener("change",e=>{profile=e.target.value;session=null;page="home";render()});
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
const oldRenderQuestionSession=renderQuestionSession;
renderQuestionSession=function(which){if(session&&session.kind==="level"){renderLevelQuestion();return}oldRenderQuestionSession(which)};
window.addEventListener("storage",()=>{store=loadStore();render()});
render();
</script>
</body></html>
